<button
  type="button"
  class="focus-widget flex min-w-14 flex-col items-center rounded-sm p-1.5 text-xs text-white"
  (click)="handleClick()"
>
  <i
    class="fa-lightbulb text-2xl"
    [class.fa-regular]="status() === 'idle'"
    [class.fa-solid]="status() !== 'idle'"
  ></i>
  <span>{{ label() }}</span>
</button>
